name: 'BMLS.iNaturalist2018.ResNet50.180epoch'
output_dir: './output/ina2018'
valid_step: 1
save_step: -1
show_step: 100
input_size: (224, 224)
color_space: 'RGB'
cpu_mode: False
seed_num: 0
ddp: False
dp: True
mixed_precision: True

dataset:
    root: '/home/anonymous/datasets'
    dataset: 'iNa2018'
    type: 'imbalanced'
    num_classes: 8142
    data_type: 'jpg'
    train_info: '/home/anonymous/datasets/data_txt/iNaturalist18_train.txt'
    valid_info: '/home/anonymous/datasets/data_txt/iNaturalist18_val.txt'
    class_index:
        many: [0, 842]
        med: [842, 4543]
        few: [4543, 8142]

backbone:
    type: 'resnet50_z'

pooling:
    type: 'GlobalAvgPooling'

reshape:
    type: 'FlattenCustom'

classifier:
    type: 'FC'
    bias: True

scaling:
    type: 'Identity'

loss:
    loss_type: 'CrossEntropyCustom'
    batch_wise: False

train:
    batch_size: 256
    num_epochs: 180
    num_workers: 32
    trainer:
        type: 'multi'
        mixup_alpha: 0.2
    optimizer:
        type: 'SGD'
        base_lr: 0.1
        weight_decay: 5e-4
        momentum: 0.9
    lr_scheduler:
        type: 'cosine'
        eta_min: 0.
    tensorboard:
        enable: True
    sampler:
        type: 'bmls'

transforms:
    train_transforms: ('random_resized_crop', 'random_horizontal_flip', 'normalize')
    test_transforms: ('resize', 'center_crop', 'normalize',)
    process_detail:
        resize: 256
        crop_size: 224
        normalize:
            mean: [0.485, 0.456, 0.406]
            std: [0.229, 0.224, 0.225]

test:
    batch_size: 256
    num_workers: 32
    model_file: 'best_model.pth'

